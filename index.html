body{background:var(--bg);color:var(--tx);font-family:-apple-system,'SF Pro Text','Helvetica Neue',sans-serif;line-height:1.5}
.wrap{max-width:1280px;margin:0 auto;padding:16px 24px}
.mono{font-family:'SF Mono','Fira Code','Consolas',monospace}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:16px;border-bottom:1px solid var(--bd);margin-bottom:16px}

.c8{flex:2;min-width:0}.c4{flex:1;min-width:280px}

.igrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.ibox .n{font-size:10px;margin-top:3px;color:var(--dm)}
.sig{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;margin-bottom:5px}
.sb{background:#34d39908;border-left:3px solid var(--gn)}.ss{background:#f8717108;border-left:3px solid var(--rd)}
table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;padding:7px 8px;color:var(--dm);font-weight:500;font-size:11px;border-bottom:1px solid var(--bd)}td{padding:7px 8px;border-bottom:1px solid #1e294015}
tbody tr:hover{background:var(--c2)}
.btn{border:none;border-radius:8px;padding:8px 16px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.bp{background:var(--ac);color:#fff}.bg{background:0;border:1px solid var(--bd);color:var(--dm)}
input[type=number]{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;color:var(--tx);font-size:13px;width:110px;font-family:inherit}

/* === NEW: Strategy expand rows === */
.str-row{cursor:pointer;transition:background .15s}
.str-row:hover{background:var(--c2)!important}
.str-row td:first-child::before{content:'▸ ';color:var(--dm);font-size:10px}
.str-row.open td:first-child::before{content:'▾ '}
.str-detail{display:none;background:#0a0e18}
.str-detail.open{display:table-row}
.str-detail td{padding:10px 12px;border-bottom:1px solid var(--bd)}
.dt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:6px}
.dt-box{background:var(--c2);border-radius:6px;padding:8px 10px;font-size:11px}
.dt-box .dt-l{color:var(--dm);font-size:9px;margin-bottom:2px;text-transform:uppercase}
.trade-list{max-height:180px;overflow-y:auto;font-size:11px;margin-top:8px}
.trade-list::-webkit-scrollbar{width:4px}

/* === NEW: Parameter panel === */
.param-panel{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.param-chip{background:var(--c2);border:1px solid var(--bd);border-radius:6px;padding:5px 10px;font-size:11px;cursor:pointer;transition:all .15s;font-family:'SF Mono',monospace}

.param-chip.active{background:var(--ac);color:#fff;border-color:var(--ac)}

.refresh-bar .refresh-fill{height:100%;background:var(--ac);transition:width 1s linear;width:0%}

/* === NEW: Lock-up card === */

.tf-tabs{display:flex;gap:2px;background:var(--c2);border-radius:6px;padding:2px}

function setStock(code){

// ====== Manual position tracking (localStorage) ======
function getPos(){
  try{const p=JSON.parse(localStorage.getItem('pos_'+STOCK_CODE));if(p&&p.price)return p;}catch(e){}return null;
}
function setPos(price,date,note){
  if(!price)return clearPos();
  localStorage.setItem('pos_'+STOCK_CODE,JSON.stringify({price:+price,date:date||new Date().toISOString().slice(0,10),note:note||'',ts:Date.now()}));
  rl(true);
}
function clearPos(){
  localStorage.removeItem('pos_'+STOCK_CODE);rl(true);
}
// === Signal-log helpers (called from button onclick) ===
function dumpSigLog(code){
  const log=JSON.parse(localStorage.getItem('wp_siglog_'+code)||'[]');
  const blob=new Blob([JSON.stringify(log,null,2)],{type:'application/json'});
  const u=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=u;a.download='siglog_'+code+'_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();URL.revokeObjectURL(u);
}
function clearSigLog(code){
  if(!confirm('清空 '+code+'.HK 的信号日志？'))return;
  localStorage.removeItem('wp_siglog_'+code);
  localStorage.removeItem('wp_siglog_active_'+code);
  rl(true);
}
function sigTab(which){

    if(btn){btn.style.background=(t===which)?'var(--ac)':'var(--c2)';btn.style.color=(t===which)?'#fff':'var(--dm)';}

const NW=[
  {d:'2026-01-08',t:'IPO上市116.2',p:'n'},{d:'2026-01-12',t:'滴滴合作+上市热',p:'b'},

  {d:'2026-03-16',t:'GLM5-Turbo+涨价20%',p:'b'},
  {d:'2026-03-31',t:'年报前大涨',p:'b'},{d:'2026-04-01',t:'年报+131%·API涨83%·ARR17亿',p:'b'},
  {d:'2026-04-08',t:'GLM5.1发布+涨价10%',p:'b'},{d:'2026-04-09',t:'冲999·腾讯云涨价',p:'b'},
  {d:'2026-04-10',t:'破千·市值4387亿',p:'b'},
  {d:'2026-04-14',t:'资金转移分析·JP摩根报告',p:'n'},
  {d:'2026-04-22',t:'Token需求暴涨·ARR2.5亿美元',p:'b'},
  {d:'2026-04-24',t:'DeepSeek-V4上线·AI板块重挫',p:'r'},
  {d:'2026-04-25',t:'DS V4-Pro 2.5折·价格战升级',p:'r'},

// Lock-up details (from prospectus)
const LOCKUP={
  batches:[
    {
      date:'2026-07-08', label:'第一批 (6个月)',
      groups:[
        {n:'Legend Capital 联想之星', shares:27109120, pct:6.16, type:'SII'},
        {n:'Meituan 美团', shares:17217310, pct:3.91, type:'SII'},
      ],
      // Plus cornerstone H-share investors (6-month lock)

        amount:'29.8亿港元', shares:25681600, pct_offer:68.63,
        investors:['JSC International (璟泉启智)','JinYi Capital (金逸)','Perseverance (高毅资产)','CICC Financial Trading','WT Asset Management','泰康人寿','广发基金','3W Fund','雾凇资本','中庸资本','凌云光技术'],

      groups:[

// ====== Multi-source data fetching ======
const PX=[
  u=>u, // direct first (Chinese APIs often allow cross-origin or JSONP)
  u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u=>`https://corsproxy.io/?url=${encodeURIComponent(u)}`,
  u=>`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
  u=>`https://thingproxy.freeboard.io/fetch/${u}`,
];
let fetchLog=[];

// --- Tencent Finance (腾讯) ---
async function fdTencent(){
  const url=`https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=${STOCK_HKFULL},day,,,365,qfq`;
  for(const px of PX){
    try{
      const ctrl=new AbortController(),tmr=setTimeout(()=>ctrl.abort(),6000);
      const purl=px(url);
      fetchLog.push({src:'腾讯',url:purl.slice(0,60),status:'...'});
      const r=await fetch(purl,{signal:ctrl.signal}).finally(()=>clearTimeout(tmr));
      if(!r.ok){fetchLog[fetchLog.length-1].status=`${r.status}`;continue;}
      const j=await r.json();
      const raw=j?.data?.[STOCK_HKFULL]?.qfqday || j?.data?.[STOCK_HKFULL]?.day;
      if(!raw?.length){fetchLog[fetchLog.length-1].status='no data';continue;}
      const d=raw.map(r=>({d:r[0],o:+r[1],c:+r[2],h:+r[3],l:+r[4],v:+r[5]})).filter(x=>x.c>0);
      if(d.length>5){lastFetchTime=new Date();lastFetchSrc='腾讯';fetchLog[fetchLog.length-1].status='✅ '+d.length+'条';return d;}
      fetchLog[fetchLog.length-1].status='<5 rows';
    }catch(e){fetchLog[fetchLog.length-1].status=e.name==='AbortError'?'timeout':e.message?.slice(0,20)||'error';}
  }
  return null;
}

// --- Sina Finance (新浪) ---
async function fdSina(){
  // Sina kline API
  const url=`https://finance.pae.baidu.com/vapi/v1/getquotation?all=1&srcid=5353&pointType=string&group=quotation_kline_ab&query=${STOCK_CODE.padStart(5,'0')}.HK&code=${STOCK_CODE.padStart(5,'0')}.HK&market_type=hk&ktype=day&count=365&finClientType=pc`;
  for(const px of PX){
    try{
      const purl=px(url);
      fetchLog.push({src:'百度',url:purl.slice(0,60),status:'...'});
      const ctrl=new AbortController(),tmr=setTimeout(()=>ctrl.abort(),6000);
      const r=await fetch(purl,{signal:ctrl.signal}).finally(()=>clearTimeout(tmr));
      if(!r.ok){fetchLog[fetchLog.length-1].status=`${r.status}`;continue;}
      const j=await r.json();
      const raw=j?.Result?.newMarketData?.keys;
      if(raw){
        // Parse Baidu format
        const ma=j.Result.newMarketData.marketData?.split(';')||[];
        if(ma.length>5){
          const d=ma.filter(s=>s).map(s=>{const p=s.split(',');return{d:p[1],o:+p[2],c:+p[3],h:+p[4],l:+p[5],v:+p[6]};}).filter(x=>x.c>0&&x.d);
          if(d.length>5){lastFetchTime=new Date();lastFetchSrc='百度';fetchLog[fetchLog.length-1].status='✅ '+d.length+'条';return d;}
        }
      }
      fetchLog[fetchLog.length-1].status='parse fail';
    }catch(e){fetchLog[fetchLog.length-1].status=e.name==='AbortError'?'timeout':e.message?.slice(0,20)||'error';}
  }
  return null;
}

// --- EastMoney (东方财富) ---
async function fdEast(){
  const url=`https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=${STOCK_EAST}&fields1=f1,f2,f3,f4,f5,f6&fields2=f51,f52,f53,f54,f55,f56,f57&klt=101&fqt=1&end=20270101&lmt=365`;
  for(const px of PX){
    try{
      const purl=px(url);
      fetchLog.push({src:'东财',url:purl.slice(0,60),status:'...'});
      const ctrl=new AbortController(),tmr=setTimeout(()=>ctrl.abort(),6000);
      const r=await fetch(purl,{signal:ctrl.signal}).finally(()=>clearTimeout(tmr));
      if(!r.ok){fetchLog[fetchLog.length-1].status=`${r.status}`;continue;}
      const j=await r.json();
      const klines=j?.data?.klines;
      if(!klines?.length){fetchLog[fetchLog.length-1].status='no data';continue;}
      const d=klines.map(s=>{const p=s.split(',');return{d:p[0],o:+p[1],c:+p[2],h:+p[3],l:+p[4],v:+p[5]};}).filter(x=>x.c>0);
      if(d.length>5){lastFetchTime=new Date();lastFetchSrc='东方财富';fetchLog[fetchLog.length-1].status='✅ '+d.length+'条';return d;}
      fetchLog[fetchLog.length-1].status='<5 rows';
    }catch(e){fetchLog[fetchLog.length-1].status=e.name==='AbortError'?'timeout':e.message?.slice(0,20)||'error';}
  }
  return null;
}

// --- Yahoo Finance (fallback) ---
async function fdYahoo(){
  const urls=[
    `https://query1.finance.yahoo.com/v8/finance/chart/${STOCK_HK}?range=1y&interval=1d`,
    `https://query2.finance.yahoo.com/v8/finance/chart/${STOCK_HK}?range=1y&interval=1d`,
  ];
  for(const yurl of urls){
    for(const px of PX){
      try{
        const purl=px(yurl);
        fetchLog.push({src:'Yahoo',url:purl.slice(0,60),status:'...'});
        const ctrl=new AbortController(),tmr=setTimeout(()=>ctrl.abort(),6000);
        const r=await fetch(purl,{signal:ctrl.signal,headers:{'X-Requested-With':'XMLHttpRequest'}}).finally(()=>clearTimeout(tmr));
        if(!r.ok){fetchLog[fetchLog.length-1].status=`${r.status}`;continue;}
        const j=await r.json(),res=j.chart?.result?.[0];
        if(!res){fetchLog[fetchLog.length-1].status='no data';continue;}
        const ts=res.timestamp,q=res.indicators.quote[0],d=[];
        for(let i=0;i<ts.length;i++){if(q.close[i]==null)continue;
          d.push({d:new Date(ts[i]*1000).toISOString().slice(0,10),o:+(q.open[i]||q.close[i]).toFixed(2),h:+(q.high[i]||q.close[i]).toFixed(2),l:+(q.low[i]||q.close[i]).toFixed(2),c:+q.close[i].toFixed(2),v:q.volume[i]||0});}
        if(d.length>5){lastFetchTime=new Date();lastFetchSrc='Yahoo';fetchLog[fetchLog.length-1].status='✅ '+d.length+'条';return d;}
        fetchLog[fetchLog.length-1].status='<5 rows';
      }catch(e){fetchLog[fetchLog.length-1].status=e.name==='AbortError'?'timeout':e.message?.slice(0,20)||'error';}
    }
  }
  return null;
}

// Master fetch: try sources in order
async function fd(){
  fetchLog=[];
  // Try Chinese sources first (more reliable for HK stocks in Asia)
  let d=await fdTencent();
  if(d)return d;
  d=await fdEast();
  if(d)return d;
  d=await fdYahoo();
  if(d)return d;
  d=await fdSina();
  if(d)return d;
  return null;
}

// ====== Intraday 5-min data ======
let ID=[],ch3=null,lastIntradayFetch=null;
async function fdIntraday(){
  // Yahoo Finance 5m
  const urls=[`https://query1.finance.yahoo.com/v8/finance/chart/${STOCK_HK}?range=5d&interval=5m`,
    `https://query2.finance.yahoo.com/v8/finance/chart/${STOCK_HK}?range=5d&interval=5m`];
  for(const yurl of urls){for(const px of PX){try{
    const ctrl=new AbortController(),tmr=setTimeout(()=>ctrl.abort(),6000);
    const r=await fetch(px(yurl),{signal:ctrl.signal}).finally(()=>clearTimeout(tmr));
    if(!r.ok)continue;const j=await r.json(),res=j.chart?.result?.[0];if(!res)continue;
    const ts=res.timestamp,q=res.indicators.quote[0],d=[];
    for(let i=0;i<ts.length;i++){if(q.close[i]==null)continue;const dt=new Date(ts[i]*1000);
      d.push({t:dt,tl:dt.toTimeString().slice(0,5),d:dt.toISOString().slice(0,10),o:+q.open[i].toFixed(2),h:+q.high[i].toFixed(2),l:+q.low[i].toFixed(2),c:+q.close[i].toFixed(2),v:q.volume[i]||0});}
    if(d.length>10){lastIntradayFetch=new Date();return d;}
  }catch(e){}}}
  // Tencent 5m fallback
  const turl=`https://web.ifzq.gtimg.cn/appstock/app/kline/mkline?param=${STOCK_HKFULL},m5,,320`;
  for(const px of PX){try{
    const ctrl=new AbortController(),tmr=setTimeout(()=>ctrl.abort(),6000);
    const r=await fetch(px(turl),{signal:ctrl.signal}).finally(()=>clearTimeout(tmr));
    if(!r.ok)continue;const j=await r.json(),raw=j?.data?.[STOCK_HKFULL]?.m5;if(!raw?.length)continue;
    const d=raw.map(r=>{const s=r[0];return{t:new Date(s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8)+'T'+s.slice(8,10)+':'+s.slice(10,12)+':00+08:00'),
      tl:s.slice(8,10)+':'+s.slice(10,12),d:s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8),o:+r[1],c:+r[2],h:+r[3],l:+r[4],v:+r[5]};}).filter(x=>x.c>0);
    if(d.length>10){lastIntradayFetch=new Date();return d;}
  }catch(e){}}
  return null;
}

// === Ch 19.4: Hang Seng Index fetcher + 4-tier status ===
// HSI gives the market backdrop. When the market is dumping (-2% or below 5-day MA),
// individual-stock signals tend to fail — we mark it 🔴 risk and gate buy signals.
async function fdHSI(){
  // Try Tencent first (most reliable for HK indices), then Yahoo
  const tencentUrl='https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=hkHSI,day,,,30,qfq';
  for(const px of PX){
    try{
      const ctrl=new AbortController(),tmr=setTimeout(()=>ctrl.abort(),5000);
      const r=await fetch(px(tencentUrl),{signal:ctrl.signal}).finally(()=>clearTimeout(tmr));
      if(!r.ok)continue;
      const j=await r.json();
      const raw=j?.data?.hkHSI?.qfqday||j?.data?.hkHSI?.day;
      if(!raw?.length)continue;
      const d=raw.map(r=>({d:r[0],o:+r[1],c:+r[2],h:+r[3],l:+r[4]})).filter(x=>x.c>0);
      if(d.length>=6)return d;
    }catch(e){}
  }
  // Yahoo fallback
  const yurl='https://query1.finance.yahoo.com/v8/finance/chart/%5EHSI?range=1mo&interval=1d';
  for(const px of PX){
    try{
      const ctrl=new AbortController(),tmr=setTimeout(()=>ctrl.abort(),5000);
      const r=await fetch(px(yurl),{signal:ctrl.signal,headers:{'X-Requested-With':'XMLHttpRequest'}}).finally(()=>clearTimeout(tmr));
      if(!r.ok)continue;
      const j=await r.json(),res=j.chart?.result?.[0];
      if(!res)continue;
      const ts=res.timestamp,q=res.indicators.quote[0],d=[];
      for(let i=0;i<ts.length;i++){if(q.close[i]==null)continue;
        d.push({d:new Date(ts[i]*1000).toISOString().slice(0,10),o:+(q.open[i]||q.close[i]).toFixed(2),h:+(q.high[i]||q.close[i]).toFixed(2),l:+(q.low[i]||q.close[i]).toFixed(2),c:+q.close[i].toFixed(2)});}
      if(d.length>=6)return d;
    }catch(e){}
  }
  return null;
}

// Compute HSI status from daily OHLC array
function hsiStatus(hsi){
  if(!hsi||hsi.length<6)return{level:'unknown',color:'var(--dm)',label:'⚪ 数据不足',chg:0,close:0,filterBuys:false};
  const last=hsi[hsi.length-1],prev=hsi[hsi.length-2];
  const chg=(last.c-prev.c)/prev.c*100;
  // 5-day SMA from last 5 days
  const last5=hsi.slice(-5);
  const ma5=last5.reduce((s,x)=>s+x.c,0)/5;
  const aboveMA5=last.c>ma5;
  // 4-tier classification per spec 19.4
  let level,color,label,confMul=1,filterBuys=false;
  if(chg<=-2||(!aboveMA5&&chg<-1)){level='risk';color='var(--rd)';label='🔴 风险';filterBuys=true;confMul=0;}
  else if(chg<=-1){level='weak';color='var(--or)';label='🟠 偏弱';confMul=0.7;}
  else if(chg>=1&&aboveMA5){level='strong';color='var(--gn)';label='🟢 强势';}
  else{level='neutral';color='var(--yl)';label='🟡 中性';}
  return{level,color,label,chg,close:last.c,ma5,aboveMA5,confMul,filterBuys};
}

function calcID(d){
  const p=20;
  const ma20=d.map((_,i)=>i<p-1?null:d.slice(i-p+1,i+1).reduce((s,x)=>s+x.c,0)/p);
  const ma60=d.map((_,i)=>i<59?null:d.slice(i-59,i+1).reduce((s,x)=>s+x.c,0)/60);
  const rsi=[];let ag=0,al=0;
  for(let i=0;i<d.length;i++){if(!i){rsi.push(50);continue;}const ch=d[i].c-d[i-1].c,g=ch>0?ch:0,l=ch<0?-ch:0;
    if(i<=14){ag+=g/14;al+=l/14;if(i<14){rsi.push(50);continue;}}else{ag=(ag*13+g)/14;al=(al*13+l)/14;}rsi.push(al===0?100:100-100/(1+ag/al));}
  const boll=d.map((_,i)=>{if(i<p-1)return{u:null,m:null,l:null};const sl=d.slice(i-p+1,i+1).map(x=>x.c),mn=ma20[i];
    const std=Math.sqrt(sl.reduce((a,v)=>a+(v-mn)**2,0)/p);return{u:mn+2*std,m:mn,l:mn-2*std};});
  let cumVP=0,cumV=0;const vwap=d.map((x,i)=>{if(i>0&&d[i].d!==d[i-1].d){cumVP=0;cumV=0;}
    cumVP+=(x.h+x.l+x.c)/3*x.v;cumV+=x.v;return cumV?cumVP/cumV:x.c;});
  return{ma20,ma60,rsi,boll,vwap};
}

// Aggregate daily data to weekly/monthly
function aggWeekly(d){const w=[];let cur=null;
  d.forEach(x=>{const dt=new Date(x.d),wk=dt.toISOString().slice(0,4)+'-W'+String(Math.ceil(((dt-new Date(dt.getFullYear(),0,1))/864e5+new Date(dt.getFullYear(),0,1).getDay()+1)/7)).padStart(2,'0');
    if(!cur||cur.wk!==wk){if(cur)w.push(cur);cur={d:x.d,wk,o:x.o,h:x.h,l:x.l,c:x.c,v:x.v};}
    else{cur.h=Math.max(cur.h,x.h);cur.l=Math.min(cur.l,x.l);cur.c=x.c;cur.v+=x.v;cur.d=x.d;}});
  if(cur)w.push(cur);return w;}
function aggMonthly(d){const m=[];let cur=null;
  d.forEach(x=>{const mo=x.d.slice(0,7);
    if(!cur||cur.mo!==mo){if(cur)m.push(cur);cur={d:x.d,mo,o:x.o,h:x.h,l:x.l,c:x.c,v:x.v};}
    else{cur.h=Math.max(cur.h,x.h);cur.l=Math.min(cur.l,x.l);cur.c=x.c;cur.v+=x.v;cur.d=x.d;}});
  if(cur)m.push(cur);return m;}

  }

  const candleBody=cd.map(x=>[Math.min(x.o,x.c),Math.max(x.o,x.c)]);

    const ctx=chart.ctx;
    meta.data.forEach((bar,i)=>{
      if(!cd[i])return;
      const x=bar.x,yScale=chart.scales.y;
      const yHigh=yScale.getPixelForValue(cd[i].h);

          return`${ctx.dataset.label}: ${ctx.parsed.y?.toFixed(1)||'—'}`;}
      }}},interaction:{mode:'index',intersect:false}}});

  // MACD sub-chart
  if(showMACD){
    const mc=_m(cd);
    ch2=new Chart(document.getElementById('c2'),{type:'bar',
      data:{labels:lb,datasets:[
        {label:'柱',data:mc.bar,backgroundColor:mc.bar.map(v=>v>=0?'#34d39970':'#f8717170'),borderWidth:0,order:2,barPercentage:.55},

        scales:{x:{display:false},y:{position:'right',ticks:{color:'#556070',font:{size:9,family:'SF Mono,monospace'}},grid:{color:'#1e294015'}}},
        plugins:{legend:{display:false},tooltip:{mode:'index',intersect:false}},interaction:{mode:'index',intersect:false}}});
    document.getElementById('macd-wrap').style.display='';
  }else{
    document.getElementById('macd-wrap').style.display='none';
  }
}

let PARAMS={
  boll_p:10, boll_m:1.5,

// Indicators
const _s=(d,p)=>d.map((_,i)=>i<p-1?null:d.slice(i-p+1,i+1).reduce((s,x)=>s+x.c,0)/p);
const _e=(d,p)=>{const k=2/(p+1),r=[];d.forEach((x,i)=>r.push(i===0?x.c:x.c*k+r[i-1]*(1-k)));return r;};
function _r(d,p=14){const r=[];let ag=0,al=0;for(let i=0;i<d.length;i++){if(!i){r.push(50);continue;}const ch=d[i].c-d[i-1].c,g=ch>0?ch:0,l=ch<0?-ch:0;if(i<=p){ag+=g/p;al+=l/p;if(i<p){r.push(50);continue;}}else{ag=(ag*(p-1)+g)/p;al=(al*(p-1)+l)/p;}r.push(al===0?100:100-100/(1+ag/al));}return r;}
function _m(d){const e12=_e(d,12),e26=_e(d,26),ml=e12.map((v,i)=>v-e26[i]);const k=2/10,sig=[];ml.forEach((v,i)=>sig.push(i===0?v:v*k+sig[i-1]*(1-k)));return{dif:ml,dea:sig,bar:ml.map((v,i)=>(v-sig[i])*2)};}
function _bi(d,p){const s=_s(d,p);return d.map((_,i)=>s[i]===null?null:(d[i].c-s[i])/s[i]*100);}
function _k(d,p=9){const r=[];let pk=50,pd=50;for(let i=0;i<d.length;i++){if(i<p-1){r.push({k:50,d:50,j:50});continue;}const sl=d.slice(i-p+1,i+1),lo=Math.min(...sl.map(x=>x.l)),hi=Math.max(...sl.map(x=>x.h));const rsv=hi===lo?50:(d[i].c-lo)/(hi-lo)*100;const k2=2/3*pk+1/3*rsv,dd=2/3*pd+1/3*k2;pk=k2;pd=dd;r.push({k:k2,d:dd,j:3*k2-2*dd});}return r;}
function _bl(d,p,m){const s=_s(d,p);return d.map((_,i)=>{if(i<p-1)return{u:null,m:null,l:null};const sl=d.slice(i-p+1,i+1).map(x=>x.c),mn=s[i],std=Math.sqrt(sl.reduce((a,v)=>a+(v-mn)**2,0)/p);return{u:mn+m*std,m:mn,l:mn-m*std};});}
function calc(d){return{r14:_r(d,PARAMS.rsi_period),mc:_m(d),m5:_s(d,5),m10:_s(d,10),m20:_s(d,20),m30:_s(d,30),bi5:_bi(d,PARAMS.bias_ma),bi10:_bi(d,10),kd:_k(d,PARAMS.kdj_period),b10:_bl(d,PARAMS.boll_p,PARAMS.boll_m),b20:_bl(d,20,2)};}

function stBt(d,I){
  const{r14,mc,b10,b20,m5,m10,m20,bi5,bi10,kd}=I;
  const P=PARAMS;
  // Helper: candle metrics
  const body=i=>Math.abs(d[i].c-d[i].o);
  const range=i=>d[i].h-d[i].l||0.01;
  const isGreen=i=>d[i].c>d[i].o;
  const lowerShadow=i=>Math.min(d[i].o,d[i].c)-d[i].l;
  const upperShadow=i=>d[i].h-Math.max(d[i].o,d[i].c);
  const avgVol=(i,n)=>i>=n?d.slice(i-n,i).reduce((s,x)=>s+x.v,0)/n:d[i].v;
  const pctChg=i=>i>0?(d[i].c-d[i-1].c)/d[i-1].c:0;

      const avgSL=rounds?trades.reduce((s,t)=>s+t.slPct,0)/rounds:(SLx*100);

        const mxDn=(minL-entryP)/entryP;
        tot+=ret;totMx+=mxUp;totMd+=mxDn;

          sigDate:b.d, entryDate:d[entryIdx].d, entryLabel,

      });

      hr[n2]={ct, wr:ct?w/ct:0, ar:ct?tot/ct:0, amx:ct?totMx/ct:0, amd:ct?totMd/ct:0, details};
    });

    return{...s,tr,hr,bT:s.b(li)&&trendOkNow,bTraw:s.b(li),sT:s.s(li),bc:tr.filter(t=>t.t==='B'&&!t.filtered).length,bcAll:tr.filter(t=>t.t==='B').length,entryType:s.e};
  });
}

          if(exitP){
            const ret=(exitP-entryP)/entryP-COST_D;

            if(equity>peak)peak=equity;
            const dd=(peak-equity)/peak;if(dd>maxDD)maxDD=dd;

      <div style="font-size:12px;font-weight:700;color:var(--pu);margin-bottom:8px">🏅 跨股票冠军 <span style="font-size:10px;color:var(--dm);font-weight:400">· 你浏览过 ${allViewedStocks.size} 只股票，以下策略在 ≥2 只都通过 70/30 验证 → 真 alpha 候选</span></div>

        <div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:11px;border-bottom:1px solid #a78bfa15">
          <span><b style="color:var(--tx)">${c.n}</b></span>
          <span class="mono" style="color:var(--pu)">${c.count}/${allViewedStocks.size} 通过 · ${c.codes.map(x=>x+'.HK').join(', ')}</span>
        </div>
      `).join('')}
      <div style="font-size:9px;color:var(--dm);margin-top:6px">规则: 测试集 ≥60 天且 ≥3 笔交易才计入投票 (避免小样本污染) · 切换股票后自动累积 · 清缓存可重置</div>
    </div>
    `:allViewedStocks.size>=2?`
    <div style="margin-top:12px;padding:8px 10px;background:var(--c2);border-radius:6px;font-size:10px;color:var(--dm)">
      🏅 跨股票冠军暂无 — 你已浏览 ${allViewedStocks.size} 只股票 (${[...allViewedStocks].map(x=>x+'.HK').join(', ')})，但没有策略在 ≥2 只都通过验证。继续浏览更多股票来累积证据。
    </div>
    `:`
    <div style="margin-top:12px;padding:8px 10px;background:var(--c2);border-radius:6px;font-size:10px;color:var(--dm)">
      🏅 浏览 ≥2 只健康样本的股票后会显示跨股票冠军 (当前只看了 ${allViewedStocks.size} 只)
    </div>
    `}
    <div style="font-size:9px;color:var(--dm);margin-top:8px;padding:6px 8px;background:var(--c2);border-radius:6px;line-height:1.6">
      <b style="color:var(--yl)">🎯 怎么用</b>：这里列出的策略是 <b>系统自己挑出来的</b>，不是预设的。<b>训练集只用前 70% 数据</b>找候选，<b>必须在没见过的后 30% 测试集</b>也正期望才入选 — 这是反过拟合最基本的方法。<br>
      过拟合警告: ${overfit?`检测到 <b style="color:var(--rd)">${overfit} 个</b>策略训练集好但测试集翻车 (已淘汰)`:'当前股票样本健康'} · 排序依据: 测试集期望值 (每笔预期回报) · 🌐徽章 = 跨股票通过次数
    </div>
    `}
  </div>`;
  })()}

  <div style="font-size:9px;color:var(--dm);text-align:center;padding:16px 0;border-top:1px solid var(--bd)">
    <div style="max-width:720px;margin:0 auto;text-align:left;line-height:1.6">
      <b style="color:var(--or)">⚠️ 系统盲区审计 + 风险警告</b><br><br>
      <b style="color:var(--cy)">✅ 已修复:</b><br>
      · <b>趋势过滤器</b> — MA20下行时屏蔽买入信号 (4入口统一: 排行/今日信号/对决/持仓)<br>
      · <b>成本0.2% + 滑点0.1%</b> — 排行/对决/HF/持仓全模块统一扣除<br>
      · <b>悲观同K判定</b> — TP+SL同K触发一律判SL<br>
      · <b>每笔ATR独立TP/SL</b> — 日线: TP=买价+2×ATR(买入当天) · SL=买价-1.5×ATR(买入当天) · 5分钟: TP=15×ATR · SL=10×ATR — 不是用今天ATR套所有历史<br>
      · <b>信号反转早退</b> — 买入策略的s(i)触发收盘出场 (自身/团队双模式 A/B 测试)<br>
      · <b>对称卖出信号</b> — 形态/量价/组合 16 个策略 buy/sell 全配对<br>
      · <b>王者自选队</b> — 70/30训练/测试分割，自动挑选两边都正期望的策略<br>
      · <b>跨股票冠军记忆</b> — localStorage 累积每只股的通过名单，自动找出 ≥2 股通过的真 alpha<br>
      · <b>v2: 样本量过滤</b> (Ch19.1) — 排行表 ≥5 笔才入"有效策略"，<5 移到"实验性"区<br>
      · <b>v2: 置信度打分</b> (Ch19.2) — 胜率×log10(笔数+1)×期望值 综合排序，避免 1 笔 100% 误导<br>
      · <b>v2: 顶部决策卡</b> (Ch19.3) — 整合持仓/趋势/波动/大盘/解禁 → 一句话建议<br>
      · <b>v2: 大盘指数过滤</b> (Ch19.4) — HSI -2% 或破 5 日均线 → 过滤所有买入信号<br>
      · <b>过拟合检测</b> — 训练集亮眼但测试集翻车的策略自动淘汰并计数<br>
      · <b>20天/20根强制退出</b> — 防无限持仓<br><br>
      <b style="color:var(--rd)">⚠️ 仍存在:</b><br>
      · <b>只做多</b> — 下跌最好不买(趋势过滤已挡大部分)<br>
      · <b>全仓进出</b> — 实际应分批30-50%<br>
      · <b>无大盘联动</b> — 恒指暴跌时信号失效<br>
      · <b>次新股偏差</b> — 无熊市样本，结果打7折<br>
      · <b>解禁事件</b> — 需配合基本面判断<br><br>
      <b style="color:var(--dm)">系统:</b> ${STOCK_HK} · ${data.length}天 · ${live?lastFetchSrc||'在线':'离线'} · ${trendLabel} · 每笔ATR独立(当前≈TP${(autoTP*100).toFixed(0)}%/SL${(autoSL*100).toFixed(0)}%) · 成本0.2%+滑点0.1%
    </div></div>`;

  setTimeout(()=>{drawChart(currentTF);drawEqChart();},80);
  // Fetch HSI in background (Ch 19.4) — cached for 5 minutes to avoid repeat fetches
  if(!window._hsiState||Date.now()-window._hsiFetchAt>300000){
    (async()=>{
      const hsi=await fdHSI();
      if(hsi){window._hsi=hsi;window._hsiState=hsiStatus(hsi);window._hsiFetchAt=Date.now();
        // Re-render to pick up HSI status in the decision card
        try{go(data,live);}catch(e){}}
    })();
  }
  // Fetch intraday data and news in background
  if(!window._hfRendered){
    (async()=>{const id=await fdIntraday();if(id){ID=id;
      if(currentTF==='5m')drawChart('5m');
      window._hfRendered=true;go(data,live);
    }})();
  }
  startAutoRefresh();
 }catch(err){ // <<<< catch go() errors
   console.error('go() error:',err);
   document.getElementById('app').innerHTML=`
   <div class="hdr"><div>
     <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
       <div style="display:flex;align-items:center;gap:6px">
         <input class="stk-input" id="stk-in" value="${STOCK_CODE}" onkeydown="if(event.key==='Enter')setStock(this.value)">
         <button class="stk-go" onclick="setStock(document.getElementById('stk-in').value)">.HK</button></div>
       <h1>${STOCK_HK}</h1></div></div>
     <div style="display:flex;gap:6px"><button class="btn bg" onclick="rl()">🔄 重新加载</button>
       <span id="refresh-lbl" class="mono" style="font-size:10px;color:var(--dm)">5:00</span></div></div>
   <div class="refresh-bar"><div class="refresh-fill"></div></div>
   <div class="card" style="border-color:var(--rd);margin-top:12px">
     <div style="font-size:12px;color:var(--or)">⚠️ 页面渲染出错，但数据已获取(${D.length}天)。自动刷新仍在运行。</div>
     <div style="font-size:10px;color:var(--dm);margin-top:6px;word-break:break-all">${err.message}</div>
   </div>`;
   startAutoRefresh();
 }
}

function toggleDetail(id,row){
  const det=document.getElementById(id);
  if(!det)return;
  det.classList.toggle('open');
  row.classList.toggle('open');
}

function setP(key,val){
  PARAMS[key]=val;
  go(D,!!document.querySelector('.badge')?.textContent?.includes('实时'));
}

function dc(data,I){ drawChart(currentTF); }
function switchTF(tf){ currentTF=tf; drawChart(tf); }

let chEq=null;
function drawEqChart(){
  const ed=window._eqData;if(!ed)return;
  if(chEq)chEq.destroy();
  const el=document.getElementById('c-eq');if(!el)return;
  chEq=new Chart(el,{type:'line',
    data:{labels:ed.labels,datasets:[
      {label:'指标派',data:ed.eqA,borderColor:ed.colorA,borderWidth:2,pointRadius:0,tension:.2,fill:false},
      {label:'形态派',data:ed.eqB,borderColor:ed.colorB,borderWidth:2,pointRadius:0,tension:.2,fill:false},
      {label:'基准',data:ed.eqA.map((_,i)=>10000),borderColor:'#556070',borderWidth:1,pointRadius:0,borderDash:[4,4],fill:false},
    ]},options:{responsive:true,maintainAspectRatio:false,
      scales:{x:{ticks:{color:'#556070',font:{size:9},maxTicksLimit:12,maxRotation:0},grid:{color:'#1e294012'}},
        y:{position:'right',ticks:{color:'#556070',font:{size:10,family:'SF Mono,monospace'},callback:v=>'$'+v.toFixed(0)},grid:{color:'#1e294015'}}},
      plugins:{legend:{display:true,position:'top',labels:{color:'#cdd5e0',font:{size:10},boxWidth:12,padding:8}},
        tooltip:{mode:'index',intersect:false,callbacks:{label:ctx=>ctx.dataset.label+': $'+ctx.parsed.y.toFixed(0)}}},
      interaction:{mode:'index',intersect:false}}});
}
function ap(){const c=parseFloat(document.getElementById('ic').value);if(!c)return alert('输入收盘价');const L=D[D.length-1];
  D.push({d:new Date().toISOString().slice(0,10),o:L.c,h:Math.max(parseFloat(document.getElementById('ih').value)||c,c,L.c),l:Math.min(parseFloat(document.getElementById('il').value)||c,c,L.c),c,v:parseFloat(document.getElementById('iv').value)||L.v});go(D,false);}
async function rl(silent){
  window._hfRendered=false;
  if(!silent)document.getElementById('app').innerHTML='<div class="loading"><div class="sp"></div><div style="margin-top:12px">获取 '+STOCK_HK+' 数据...</div></div>';
  const d=await fd();
  const cacheKey='zd_'+STOCK_CODE;
  if(d){localStorage.setItem(cacheKey,JSON.stringify(d));go(d,true);}
  else{go(D.length?D:(STOCK_CODE==='2513'?FB:[]),false);}
}

async function init(){
  document.title=STOCK_HK+' 技术监控';
  const cacheKey='zd_'+STOCK_CODE;
  const d=await fd();
  if(d?.length>5){localStorage.setItem(cacheKey,JSON.stringify(d));go(d,true);}
  else{try{const c=JSON.parse(localStorage.getItem(cacheKey));if(c?.length>5){go(c,false);return;}}catch(e){}
    if(STOCK_CODE==='2513')go(FB,false);
    else{
      document.getElementById('app').innerHTML=`
      <div class="hdr"><div>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <div style="display:flex;align-items:center;gap:6px">
            <input class="stk-input" id="stk-in" value="${STOCK_CODE}" onkeydown="if(event.key==='Enter')setStock(this.value)">
            <button class="stk-go" onclick="setStock(document.getElementById('stk-in').value)">.HK</button>
          </div>
          <h1 style="color:var(--rd)">⚠️ ${STOCK_HK}</h1>
        </div>
      </div>
      <div style="display:flex;gap:6px"><button class="btn bg" onclick="rl()">🔄 重试</button></div></div>
      <div class="card" style="border-color:var(--rd);margin-top:20px">
        <div class="card-t" style="color:var(--rd)">数据获取失败</div>
        <div style="font-size:13px;color:var(--tx);line-height:1.8">
          ${STOCK_HK} 未能获取到数据。可能原因:<br>
          · 股票代码错误或不存在<br>
          · 该股票未上市或已停牌<br>
          · 网络暂时不可用<br>
        </div>
        <div style="margin-top:16px;padding:12px;background:var(--c2);border-radius:8px">
          <div style="font-size:12px;color:var(--dm);margin-bottom:8px">💡 左上角输入其他代码重试，例如:</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn bp" onclick="setStock('2513')">2513 智谱</button>
            <button class="btn bp" onclick="setStock('3317')">3317 讯策</button>
            <button class="btn bg" onclick="setStock('700')">700 腾讯</button>
            <button class="btn bg" onclick="setStock('9988')">9988 阿里</button>
            <button class="btn bg" onclick="setStock('1810')">1810 小米</button>
            <button class="btn bg" onclick="setStock('3690')">3690 美团</button>
          </div>
        </div>
      </div>`;
    }
  }
}
init();
</script>
