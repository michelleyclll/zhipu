*{margin:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,'SF Pro Text','Helvetica Neue',sans-serif;line-height:1.5}
.wrap{max-width:1280px;margin:0 auto;padding:16px 24px}
.mono{font-family:'SF Mono','Fira Code','Consolas',monospace}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:16px;border-bottom:1px solid var(--bd);margin-bottom:16px}
.hdr h1{font-size:20px;font-weight:700;letter-spacing:-.5px}

.chg{font-size:18px;font-weight:600}

// ====== Multi-source data fetching ======
const PX=[

  u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,

let fetchLog=[];

// --- Tencent Finance (腾讯) ---
async function fdTencent(){
  const url=`https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=${STOCK_HKFULL},day,,,365,qfq`;
  for(const px of PX){
    try{
      const ctrl=new AbortController(),tmr=setTimeout(()=>ctrl.abort(),6000);
      const purl=px(url);
      fetchLog.push({src:'腾讯',url:purl.slice(0,60),status:'...'});
      const r=await fetch(purl,{signal:ctrl.signal}).finally(()=>clearTimeout(tmr));
      if(!r.ok){fetchLog[fetchLog.length-1].status=`${r.status}`;continue;}
      const j=await r.json();
      const raw=j?.data?.[STOCK_HKFULL]?.qfqday || j?.data?.[STOCK_HKFULL]?.day;
      if(!raw?.length){fetchLog[fetchLog.length-1].status='no data';continue;}
      const d=raw.map(r=>({d:r[0],o:+r[1],c:+r[2],h:+r[3],l:+r[4],v:+r[5]})).filter(x=>x.c>0);
      if(d.length>5){lastFetchTime=new Date();lastFetchSrc='腾讯';fetchLog[fetchLog.length-1].status='✅ '+d.length+'条';return d;}
      fetchLog[fetchLog.length-1].status='<5 rows';
    }catch(e){fetchLog[fetchLog.length-1].status=e.name==='AbortError'?'timeout':e.message?.slice(0,20)||'error';}
  }
  return null;
}

// --- Sina Finance (新浪) ---
async function fdSina(){
  // Sina kline API
  const url=`https://finance.pae.baidu.com/vapi/v1/getquotation?all=1&srcid=5353&pointType=string&group=quotation_kline_ab&query=${STOCK_CODE.padStart(5,'0')}.HK&code=${STOCK_CODE.padStart(5,'0')}.HK&market_type=hk&ktype=day&count=365&finClientType=pc`;
  for(const px of PX){
    try{
      const purl=px(url);
      fetchLog.push({src:'百度',url:purl.slice(0,60),status:'...'});
      const ctrl=new AbortController(),tmr=setTimeout(()=>ctrl.abort(),6000);
      const r=await fetch(purl,{signal:ctrl.signal}).finally(()=>clearTimeout(tmr));
      if(!r.ok){fetchLog[fetchLog.length-1].status=`${r.status}`;continue;}
      const j=await r.json();
      const raw=j?.Result?.newMarketData?.keys;
      if(raw){
        // Parse Baidu format
        const ma=j.Result.newMarketData.marketData?.split(';')||[];
        if(ma.length>5){
          const d=ma.filter(s=>s).map(s=>{const p=s.split(',');return{d:p[1],o:+p[2],c:+p[3],h:+p[4],l:+p[5],v:+p[6]};}).filter(x=>x.c>0&&x.d);
          if(d.length>5){lastFetchTime=new Date();lastFetchSrc='百度';fetchLog[fetchLog.length-1].status='✅ '+d.length+'条';return d;}
        }
      }
      fetchLog[fetchLog.length-1].status='parse fail';
    }catch(e){fetchLog[fetchLog.length-1].status=e.name==='AbortError'?'timeout':e.message?.slice(0,20)||'error';}
  }
  return null;
}

      if(d.length>5){lastFetchTime=new Date();lastFetchSrc='东方财富';fetchLog[fetchLog.length-1].status='✅ '+d.length+'条';return d;}
      fetchLog[fetchLog.length-1].status='<5 rows';

// --- Yahoo Finance (fallback) ---
async function fdYahoo(){
  const urls=[
    `https://query1.finance.yahoo.com/v8/finance/chart/${STOCK_HK}?range=1y&interval=1d`,
    `https://query2.finance.yahoo.com/v8/finance/chart/${STOCK_HK}?range=1y&interval=1d`,
  ];
  for(const yurl of urls){
    for(const px of PX){
      try{
        const purl=px(yurl);
        fetchLog.push({src:'Yahoo',url:purl.slice(0,60),status:'...'});
        const ctrl=new AbortController(),tmr=setTimeout(()=>ctrl.abort(),6000);
        const r=await fetch(purl,{signal:ctrl.signal,headers:{'X-Requested-With':'XMLHttpRequest'}}).finally(()=>clearTimeout(tmr));
        if(!r.ok){fetchLog[fetchLog.length-1].status=`${r.status}`;continue;}
        const j=await r.json(),res=j.chart?.result?.[0];
        if(!res){fetchLog[fetchLog.length-1].status='no data';continue;}
        const ts=res.timestamp,q=res.indicators.quote[0],d=[];
        for(let i=0;i<ts.length;i++){if(q.close[i]==null)continue;
          d.push({d:new Date(ts[i]*1000).toISOString().slice(0,10),o:+(q.open[i]||q.close[i]).toFixed(2),h:+(q.high[i]||q.close[i]).toFixed(2),l:+(q.low[i]||q.close[i]).toFixed(2),c:+q.close[i].toFixed(2),v:q.volume[i]||0});}
        if(d.length>5){lastFetchTime=new Date();lastFetchSrc='Yahoo';fetchLog[fetchLog.length-1].status='✅ '+d.length+'条';return d;}
        fetchLog[fetchLog.length-1].status='<5 rows';
      }catch(e){fetchLog[fetchLog.length-1].status=e.name==='AbortError'?'timeout':e.message?.slice(0,20)||'error';}
    }
  }
  return null;
}

let ID=[],ch3=null,lastIntradayFetch=null;
async function fdIntraday(){
  // Yahoo Finance 5m
  const urls=[`https://query1.finance.yahoo.com/v8/finance/chart/${STOCK_HK}?range=5d&interval=5m`,
    `https://query2.finance.yahoo.com/v8/finance/chart/${STOCK_HK}?range=5d&interval=5m`];
  for(const yurl of urls){for(const px of PX){try{
    const ctrl=new AbortController(),tmr=setTimeout(()=>ctrl.abort(),6000);
    const r=await fetch(px(yurl),{signal:ctrl.signal}).finally(()=>clearTimeout(tmr));
    if(!r.ok)continue;const j=await r.json(),res=j.chart?.result?.[0];if(!res)continue;
    const ts=res.timestamp,q=res.indicators.quote[0],d=[];
    for(let i=0;i<ts.length;i++){if(q.close[i]==null)continue;const dt=new Date(ts[i]*1000);
      d.push({t:dt,tl:dt.toTimeString().slice(0,5),d:dt.toISOString().slice(0,10),o:+q.open[i].toFixed(2),h:+q.high[i].toFixed(2),l:+q.low[i].toFixed(2),c:+q.close[i].toFixed(2),v:q.volume[i]||0});}
    if(d.length>10){lastIntradayFetch=new Date();return d;}
  }catch(e){}}}
  // Tencent 5m fallback
  const turl=`https://web.ifzq.gtimg.cn/appstock/app/kline/mkline?param=${STOCK_HKFULL},m5,,320`;
  for(const px of PX){try{
    const ctrl=new AbortController(),tmr=setTimeout(()=>ctrl.abort(),6000);
    const r=await fetch(px(turl),{signal:ctrl.signal}).finally(()=>clearTimeout(tmr));
    if(!r.ok)continue;const j=await r.json(),raw=j?.data?.[STOCK_HKFULL]?.m5;if(!raw?.length)continue;
    const d=raw.map(r=>{const s=r[0];return{t:new Date(s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8)+'T'+s.slice(8,10)+':'+s.slice(10,12)+':00+08:00'),
      tl:s.slice(8,10)+':'+s.slice(10,12),d:s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8),o:+r[1],c:+r[2],h:+r[3],l:+r[4],v:+r[5]};}).filter(x=>x.c>0);
    if(d.length>10){lastIntradayFetch=new Date();return d;}
  }catch(e){}}
  return null;
}
function calcID(d){
  const p=20;
  const ma20=d.map((_,i)=>i<p-1?null:d.slice(i-p+1,i+1).reduce((s,x)=>s+x.c,0)/p);
  const ma60=d.map((_,i)=>i<59?null:d.slice(i-59,i+1).reduce((s,x)=>s+x.c,0)/60);
  const rsi=[];let ag=0,al=0;
  for(let i=0;i<d.length;i++){if(!i){rsi.push(50);continue;}const ch=d[i].c-d[i-1].c,g=ch>0?ch:0,l=ch<0?-ch:0;
    if(i<=14){ag+=g/14;al+=l/14;if(i<14){rsi.push(50);continue;}}else{ag=(ag*13+g)/14;al=(al*13+l)/14;}rsi.push(al===0?100:100-100/(1+ag/al));}
  const boll=d.map((_,i)=>{if(i<p-1)return{u:null,m:null,l:null};const sl=d.slice(i-p+1,i+1).map(x=>x.c),mn=ma20[i];
    const std=Math.sqrt(sl.reduce((a,v)=>a+(v-mn)**2,0)/p);return{u:mn+2*std,m:mn,l:mn-2*std};});
  let cumVP=0,cumV=0;const vwap=d.map((x,i)=>{if(i>0&&d[i].d!==d[i-1].d){cumVP=0;cumV=0;}
    cumVP+=(x.h+x.l+x.c)/3*x.v;cumV+=x.v;return cumV?cumVP/cumV:x.c;});
  return{ma20,ma60,rsi,boll,vwap};
}
// drawIntraday is now handled by drawChart('5m')

// Aggregate daily data to weekly/monthly
function aggWeekly(d){const w=[];let cur=null;
  d.forEach(x=>{const dt=new Date(x.d),wk=dt.toISOString().slice(0,4)+'-W'+String(Math.ceil(((dt-new Date(dt.getFullYear(),0,1))/864e5+new Date(dt.getFullYear(),0,1).getDay()+1)/7)).padStart(2,'0');
    if(!cur||cur.wk!==wk){if(cur)w.push(cur);cur={d:x.d,wk,o:x.o,h:x.h,l:x.l,c:x.c,v:x.v};}
    else{cur.h=Math.max(cur.h,x.h);cur.l=Math.min(cur.l,x.l);cur.c=x.c;cur.v+=x.v;cur.d=x.d;}});
  if(cur)w.push(cur);return w;}
function aggMonthly(d){const m=[];let cur=null;
  d.forEach(x=>{const mo=x.d.slice(0,7);
    if(!cur||cur.mo!==mo){if(cur)m.push(cur);cur={d:x.d,mo,o:x.o,h:x.h,l:x.l,c:x.c,v:x.v};}
    else{cur.h=Math.max(cur.h,x.h);cur.l=Math.min(cur.l,x.l);cur.c=x.c;cur.v+=x.v;cur.d=x.d;}});
  if(cur)m.push(cur);return m;}

// Unified chart drawing for all timeframes
function drawChart(tf){

  }

  const volScale=(priceMax-priceMin)*0.18;
  const volData=cd.map(x=>[priceMin,priceMin+x.v/maxV*volScale]);
  const volColor=cd.map(x=>x.c>=x.o?'#f8717130':'#34d39930');

    {label:'成交量',type:'bar',data:volData,backgroundColor:volColor,borderWidth:0,barPercentage:.6,categoryPercentage:.9,order:3,yAxisID:'y'},

    meta.data.forEach((bar,i)=>{

  ch1=new Chart(document.getElementById('c1'),{type:'bar',
    data:{labels:lb,datasets},
    plugins:[wickPlugin],
    options:{responsive:true,maintainAspectRatio:false,
      scales:{x:{ticks:{color:'#556070',font:{size:currentTF==='5m'?9:10},maxTicksLimit:currentTF==='5m'?16:14,maxRotation:0},grid:{color:'#1e294012'}},
        y:{position:'right',ticks:{color:'#556070',font:{size:11,family:'SF Mono,monospace'},callback:v=>v.toFixed(0)},grid:{color:'#1e294025'}}},
      plugins:{legend:{display:false},annotation:{annotations:an},tooltip:{mode:'index',intersect:false,callbacks:{
        label:ctx=>{if(ctx.datasetIndex===1){const d2=cd[ctx.dataIndex];return`开${d2.o} 高${d2.h} 低${d2.l} 收${d2.c}`;}
          if(ctx.datasetIndex===0)return`量 ${(cd[ctx.dataIndex].v/1e4).toFixed(0)}万`;
          return`${ctx.dataset.label}: ${ctx.parsed.y?.toFixed(1)||'—'}`;}
      }}},interaction:{mode:'index',intersect:false}}});

  // MACD sub-chart
  if(showMACD){
    const mc=_m(cd);
    ch2=new Chart(document.getElementById('c2'),{type:'bar',
      data:{labels:lb,datasets:[
        {label:'柱',data:mc.bar,backgroundColor:mc.bar.map(v=>v>=0?'#34d39970':'#f8717170'),borderWidth:0,order:2,barPercentage:.55},
        {label:'DIF',data:mc.dif,type:'line',borderColor:'#5ba3ff',borderWidth:1.5,pointRadius:0,tension:.3,fill:false,order:1},
        {label:'DEA',data:mc.dea,type:'line',borderColor:'#fb923c',borderWidth:1.5,pointRadius:0,tension:.3,fill:false,order:1},
      ]},options:{responsive:true,maintainAspectRatio:false,
        scales:{x:{display:false},y:{position:'right',ticks:{color:'#556070',font:{size:9,family:'SF Mono,monospace'}},grid:{color:'#1e294015'}}},
        plugins:{legend:{display:false},tooltip:{mode:'index',intersect:false}},interaction:{mode:'index',intersect:false}}});
    document.getElementById('macd-wrap').style.display='';
  }else{
    document.getElementById('macd-wrap').style.display='none';
  }
}

// Indicators
const _s=(d,p)=>d.map((_,i)=>i<p-1?null:d.slice(i-p+1,i+1).reduce((s,x)=>s+x.c,0)/p);
const _e=(d,p)=>{const k=2/(p+1),r=[];d.forEach((x,i)=>r.push(i===0?x.c:x.c*k+r[i-1]*(1-k)));return r;};
function _r(d,p=14){const r=[];let ag=0,al=0;for(let i=0;i<d.length;i++){if(!i){r.push(50);continue;}const ch=d[i].c-d[i-1].c,g=ch>0?ch:0,l=ch<0?-ch:0;if(i<=p){ag+=g/p;al+=l/p;if(i<p){r.push(50);continue;}}else{ag=(ag*(p-1)+g)/p;al=(al*(p-1)+l)/p;}r.push(al===0?100:100-100/(1+ag/al));}return r;}
function _m(d){const e12=_e(d,12),e26=_e(d,26),ml=e12.map((v,i)=>v-e26[i]);const k=2/10,sig=[];ml.forEach((v,i)=>sig.push(i===0?v:v*k+sig[i-1]*(1-k)));return{dif:ml,dea:sig,bar:ml.map((v,i)=>(v-sig[i])*2)};}
function _bi(d,p){const s=_s(d,p);return d.map((_,i)=>s[i]===null?null:(d[i].c-s[i])/s[i]*100);}
function _k(d,p=9){const r=[];let pk=50,pd=50;for(let i=0;i<d.length;i++){if(i<p-1){r.push({k:50,d:50,j:50});continue;}const sl=d.slice(i-p+1,i+1),lo=Math.min(...sl.map(x=>x.l)),hi=Math.max(...sl.map(x=>x.h));const rsv=hi===lo?50:(d[i].c-lo)/(hi-lo)*100;const k2=2/3*pk+1/3*rsv,dd=2/3*pd+1/3*k2;pk=k2;pd=dd;r.push({k:k2,d:dd,j:3*k2-2*dd});}return r;}
function _bl(d,p,m){const s=_s(d,p);return d.map((_,i)=>{if(i<p-1)return{u:null,m:null,l:null};const sl=d.slice(i-p+1,i+1).map(x=>x.c),mn=s[i],std=Math.sqrt(sl.reduce((a,v)=>a+(v-mn)**2,0)/p);return{u:mn+m*std,m:mn,l:mn-m*std};});}
function calc(d){return{r14:_r(d,PARAMS.rsi_period),mc:_m(d),m5:_s(d,5),m10:_s(d,10),m20:_s(d,20),m30:_s(d,30),bi5:_bi(d,PARAMS.bias_ma),bi10:_bi(d,10),kd:_k(d,PARAMS.kdj_period),b10:_bl(d,PARAMS.boll_p,PARAMS.boll_m),b20:_bl(d,20,2)};}

          <div>交易 <b class="mono">${rB.trades}笔</b></div>
          <div>胜率 <b class="mono" style="color:${rB.wr>=.5?'var(--gn)':'var(--rd)'}">${(rB.wr*100).toFixed(0)}%</b></div>
          <div>最大回撤 <b class="mono" style="color:var(--rd)">${(rB.maxDD*100).toFixed(1)}%</b></div>
          <div>策略数 <b class="mono">${teamB.strategies.length}</b></div>
        </div>
      </div>
    </div>
    <div style="font-size:10px;color:var(--dm);margin-bottom:6px">累计权益曲线 (起始 $10,000)</div>
    <div style="height:200px;position:relative"><canvas id="c-eq"></canvas></div>
    <div style="font-size:9px;color:var(--dm);margin-top:8px;padding:6px 8px;background:var(--c2);border-radius:6px">
      规则: 每队策略池共享信号 → 任一策略触发买入即开仓 → 持有${holdN}日收盘卖出 → 空仓等待下一信号 → 不重叠持仓<br>
      同日多信号取第一个触发的 · 买入基准: B股(${PARAMS.entry_mode==='trigger'?'触发价/尾盘价':PARAMS.entry_mode==='next_open'?'T+1开盘价':'当日尾盘价'}) · 每笔全仓进出
    </div>
  </div>`;
  })()}

  <div style="font-size:9px;color:var(--dm);text-align:center;padding:16px 0;border-top:1px solid var(--bd)">
    <div style="max-width:720px;margin:0 auto;text-align:left;line-height:1.6">
      <b style="color:var(--or)">⚠️ 风险警告</b><br>
      · 本工具仅为个人学习使用的技术分析辅助面板，<b style="color:var(--rd)">不构成任何投资建议</b><br>
      · 当前标的: <b>${STOCK_HK}</b> · 数据来源: ${live?lastFetchSrc||'在线':'离线近似'} · 每5分钟自动刷新<br>
      · 回测基于约 ${data.length} 个交易日，样本极小，统计意义有限<br>
      · 回测逻辑: 信号确认 → 按「${PARAMS.entry_mode==='next_open'?'T+1开盘价':PARAMS.entry_mode==='trigger'?'盘中触发价/尾盘价':'当日尾盘价'}」买入 → 持有N日后收盘卖出<br>
      · 入场方式可切换: 当日尾盘(盯盘下单) / T+1开盘(保守) / 盘中触发(配合5分钟图)<br>
      · 5分钟线数据来源Yahoo/腾讯，仅供盘中实时参考，VWAP每日重置<br>
      · 盘中最大浮盈/回撤 = 持有期间每日最高/最低价 vs 实际买入价，反映持有期间真实波动风险<br>
      · K线形态识别(锤子/吞没/十字星等)基于日线 OHLC 四价，不含分时数据<br>
      ${isZhipu?'· 智谱为2026年1月上市次新股，流通盘极小(H股仅~8.5%)，波动剧烈，技术指标参考价值受限<br>· 解禁数据来源于招股书，实际减持行为取决于市场条件及股东意愿':''}
    </div>
    ${!live?`<div style="margin-top:6px;text-align:left;background:var(--c2);padding:8px;border-radius:6px;color:var(--rd)">
      <b>⚠️ 数据获取失败，显示离线数据（可能不准确）。</b> 尝试记录：<br>
      ${fetchLog.map(l=>`<span style="color:${l.status.startsWith('✅')?'var(--gn)':'var(--rd)'}">· [${l.src}] ${l.url}... → ${l.status}</span><br>`).join('')}
      <div style="margin-top:4px;color:var(--yl)">💡 可尝试：1) 刷新重试 2) 换浏览器/网络 3) 点「＋ 输入」手动填今日收盘价</div>
    </div>`:''}</div>`;

  setTimeout(()=>{drawChart(currentTF);drawEqChart();},80);
  // Fetch intraday data and news in background
  if(!window._hfRendered){
    (async()=>{const id=await fdIntraday();if(id){ID=id;
      if(currentTF==='5m')drawChart('5m');
      window._hfRendered=true;go(data,live);
    }})();
  }
  fetchNews();
  startAutoRefresh();
}

function toggleDetail(id,row){
  const det=document.getElementById(id);
  if(!det)return;
  det.classList.toggle('open');
  row.classList.toggle('open');
}

function setP(key,val){
  PARAMS[key]=val;
  go(D,!!document.querySelector('.badge')?.textContent?.includes('实时'));
}

function dc(data,I){ drawChart(currentTF); }
function switchTF(tf){ currentTF=tf; drawChart(tf); }

let chEq=null;
function drawEqChart(){
  const ed=window._eqData;if(!ed)return;
  if(chEq)chEq.destroy();
  const el=document.getElementById('c-eq');if(!el)return;
  chEq=new Chart(el,{type:'line',
    data:{labels:ed.labels,datasets:[
      {label:'指标派',data:ed.eqA,borderColor:ed.colorA,borderWidth:2,pointRadius:0,tension:.2,fill:false},
      {label:'形态派',data:ed.eqB,borderColor:ed.colorB,borderWidth:2,pointRadius:0,tension:.2,fill:false},
      {label:'基准',data:ed.eqA.map((_,i)=>10000),borderColor:'#556070',borderWidth:1,pointRadius:0,borderDash:[4,4],fill:false},
    ]},options:{responsive:true,maintainAspectRatio:false,
      scales:{x:{ticks:{color:'#556070',font:{size:9},maxTicksLimit:12,maxRotation:0},grid:{color:'#1e294012'}},
        y:{position:'right',ticks:{color:'#556070',font:{size:10,family:'SF Mono,monospace'},callback:v=>'$'+v.toFixed(0)},grid:{color:'#1e294015'}}},
      plugins:{legend:{display:true,position:'top',labels:{color:'#cdd5e0',font:{size:10},boxWidth:12,padding:8}},
        tooltip:{mode:'index',intersect:false,callbacks:{label:ctx=>ctx.dataset.label+': $'+ctx.parsed.y.toFixed(0)}}},
      interaction:{mode:'index',intersect:false}}});
}
function ap(){const c=parseFloat(document.getElementById('ic').value);if(!c)return alert('输入收盘价');const L=D[D.length-1];
  D.push({d:new Date().toISOString().slice(0,10),o:L.c,h:Math.max(parseFloat(document.getElementById('ih').value)||c,c,L.c),l:Math.min(parseFloat(document.getElementById('il').value)||c,c,L.c),c,v:parseFloat(document.getElementById('iv').value)||L.v});go(D,false);}
async function rl(silent){
  window._hfRendered=false;
  if(!silent)document.getElementById('app').innerHTML='<div class="loading"><div class="sp"></div><div style="margin-top:12px">获取 '+STOCK_HK+' 数据...</div></div>';
  const d=await fd();
  const cacheKey='zd_'+STOCK_CODE;
  if(d){localStorage.setItem(cacheKey,JSON.stringify(d));go(d,true);}
  else{go(D.length?D:(STOCK_CODE==='2513'?FB:[]),false);}
}

async function init(){
  document.title=STOCK_HK+' 技术监控';
  const cacheKey='zd_'+STOCK_CODE;
  const d=await fd();
  if(d?.length>5){localStorage.setItem(cacheKey,JSON.stringify(d));go(d,true);}
  else{try{const c=JSON.parse(localStorage.getItem(cacheKey));if(c?.length>5){go(c,false);return;}}catch(e){}
    if(STOCK_CODE==='2513')go(FB,false);
    else{
      document.getElementById('app').innerHTML=`
      <div class="hdr"><div>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <div style="display:flex;align-items:center;gap:6px">
            <input class="stk-input" id="stk-in" value="${STOCK_CODE}" onkeydown="if(event.key==='Enter')setStock(this.value)">
            <button class="stk-go" onclick="setStock(document.getElementById('stk-in').value)">.HK</button>
          </div>
          <h1 style="color:var(--rd)">⚠️ ${STOCK_HK}</h1>
        </div>
      </div>
      <div style="display:flex;gap:6px"><button class="btn bg" onclick="rl()">🔄 重试</button></div></div>
      <div class="card" style="border-color:var(--rd);margin-top:20px">
        <div class="card-t" style="color:var(--rd)">数据获取失败</div>
        <div style="font-size:13px;color:var(--tx);line-height:1.8">
          ${STOCK_HK} 未能获取到数据。可能原因:<br>
          · 股票代码错误或不存在<br>
          · 该股票未上市或已停牌<br>
          · 网络暂时不可用<br>
        </div>
        <div style="margin-top:16px;padding:12px;background:var(--c2);border-radius:8px">
          <div style="font-size:12px;color:var(--dm);margin-bottom:8px">💡 左上角输入其他代码重试，例如:</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn bp" onclick="setStock('2513')">2513 智谱</button>
            <button class="btn bp" onclick="setStock('3317')">3317 讯策</button>
            <button class="btn bg" onclick="setStock('700')">700 腾讯</button>
            <button class="btn bg" onclick="setStock('9988')">9988 阿里</button>
            <button class="btn bg" onclick="setStock('1810')">1810 小米</button>
            <button class="btn bg" onclick="setStock('3690')">3690 美团</button>
          </div>
        </div>
      </div>`;
    }
  }
}
init();
</script>
