const PX=[

// --- Tencent Finance (腾讯) ---
async function fdTencent(){
  const url='https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=hk02513,day,,,365,qfq';
  for(const px of PX){
    try{
      const ctrl=new AbortController(),tmr=setTimeout(()=>ctrl.abort(),6000);
      const purl=px(url);
      fetchLog.push({src:'腾讯',url:purl.slice(0,60),status:'...'});
      const r=await fetch(purl,{signal:ctrl.signal}).finally(()=>clearTimeout(tmr));
      if(!r.ok){fetchLog[fetchLog.length-1].status=`${r.status}`;continue;}
      const j=await r.json();
      const raw=j?.data?.hk02513?.qfqday || j?.data?.hk02513?.day;
      if(!raw?.length){fetchLog[fetchLog.length-1].status='no data';continue;}
      const d=raw.map(r=>({d:r[0],o:+r[1],c:+r[2],h:+r[3],l:+r[4],v:+r[5]})).filter(x=>x.c>0);
      if(d.length>5){lastFetchTime=new Date();lastFetchSrc='腾讯';fetchLog[fetchLog.length-1].status='✅ '+d.length+'条';return d;}
      fetchLog[fetchLog.length-1].status='<5 rows';
    }catch(e){fetchLog[fetchLog.length-1].status=e.name==='AbortError'?'timeout':e.message?.slice(0,20)||'error';}
  }
  return null;
}

}

// --- Yahoo Finance (fallback) ---
async function fdYahoo(){
  const urls=[

// ====== Intraday 5-min data ======
let ID=[],ch3=null,lastIntradayFetch=null;
async function fdIntraday(){
  // Yahoo Finance 5m
  const urls=['https://query1.finance.yahoo.com/v8/finance/chart/2513.HK?range=5d&interval=5m',
    'https://query2.finance.yahoo.com/v8/finance/chart/2513.HK?range=5d&interval=5m'];
  for(const yurl of urls){for(const px of PX){try{
    const ctrl=new AbortController(),tmr=setTimeout(()=>ctrl.abort(),6000);
    const r=await fetch(px(yurl),{signal:ctrl.signal}).finally(()=>clearTimeout(tmr));
    if(!r.ok)continue;const j=await r.json(),res=j.chart?.result?.[0];if(!res)continue;
    const ts=res.timestamp,q=res.indicators.quote[0],d=[];
    for(let i=0;i<ts.length;i++){if(q.close[i]==null)continue;const dt=new Date(ts[i]*1000);
      d.push({t:dt,tl:dt.toTimeString().slice(0,5),d:dt.toISOString().slice(0,10),o:+q.open[i].toFixed(2),h:+q.high[i].toFixed(2),l:+q.low[i].toFixed(2),c:+q.close[i].toFixed(2),v:q.volume[i]||0});}
    if(d.length>10){lastIntradayFetch=new Date();return d;}
  }catch(e){}}}
  // Tencent 5m fallback
  const turl='https://web.ifzq.gtimg.cn/appstock/app/kline/mkline?param=hk02513,m5,,320';
  for(const px of PX){try{
    const ctrl=new AbortController(),tmr=setTimeout(()=>ctrl.abort(),6000);
    const r=await fetch(px(turl),{signal:ctrl.signal}).finally(()=>clearTimeout(tmr));
    if(!r.ok)continue;const j=await r.json(),raw=j?.data?.hk02513?.m5;if(!raw?.length)continue;
    const d=raw.map(r=>{const s=r[0];return{t:new Date(s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8)+'T'+s.slice(8,10)+':'+s.slice(10,12)+':00+08:00'),
      tl:s.slice(8,10)+':'+s.slice(10,12),d:s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8),o:+r[1],c:+r[2],h:+r[3],l:+r[4],v:+r[5]};}).filter(x=>x.c>0);
    if(d.length>10){lastIntradayFetch=new Date();return d;}
  }catch(e){}}
  return null;
}
function calcID(d){
  const p=20;
  const ma20=d.map((_,i)=>i<p-1?null:d.slice(i-p+1,i+1).reduce((s,x)=>s+x.c,0)/p);
  const ma60=d.map((_,i)=>i<59?null:d.slice(i-59,i+1).reduce((s,x)=>s+x.c,0)/60);
  const rsi=[];let ag=0,al=0;
  for(let i=0;i<d.length;i++){if(!i){rsi.push(50);continue;}const ch=d[i].c-d[i-1].c,g=ch>0?ch:0,l=ch<0?-ch:0;
    if(i<=14){ag+=g/14;al+=l/14;if(i<14){rsi.push(50);continue;}}else{ag=(ag*13+g)/14;al=(al*13+l)/14;}rsi.push(al===0?100:100-100/(1+ag/al));}
  const boll=d.map((_,i)=>{if(i<p-1)return{u:null,m:null,l:null};const sl=d.slice(i-p+1,i+1).map(x=>x.c),mn=ma20[i];
    const std=Math.sqrt(sl.reduce((a,v)=>a+(v-mn)**2,0)/p);return{u:mn+2*std,m:mn,l:mn-2*std};});
  let cumVP=0,cumV=0;const vwap=d.map((x,i)=>{if(i>0&&d[i].d!==d[i-1].d){cumVP=0;cumV=0;}
    cumVP+=(x.h+x.l+x.c)/3*x.v;cumV+=x.v;return cumV?cumVP/cumV:x.c;});
  return{ma20,ma60,rsi,boll,vwap};
}
// drawIntraday is now handled by drawChart('5m')

// Aggregate daily data to weekly/monthly
function aggWeekly(d){const w=[];let cur=null;
  d.forEach(x=>{const dt=new Date(x.d),wk=dt.toISOString().slice(0,4)+'-W'+String(Math.ceil(((dt-new Date(dt.getFullYear(),0,1))/864e5+new Date(dt.getFullYear(),0,1).getDay()+1)/7)).padStart(2,'0');
    if(!cur||cur.wk!==wk){if(cur)w.push(cur);cur={d:x.d,wk,o:x.o,h:x.h,l:x.l,c:x.c,v:x.v};}
    else{cur.h=Math.max(cur.h,x.h);cur.l=Math.min(cur.l,x.l);cur.c=x.c;cur.v+=x.v;cur.d=x.d;}});
  if(cur)w.push(cur);return w;}
function aggMonthly(d){const m=[];let cur=null;
  d.forEach(x=>{const mo=x.d.slice(0,7);
    if(!cur||cur.mo!==mo){if(cur)m.push(cur);cur={d:x.d,mo,o:x.o,h:x.h,l:x.l,c:x.c,v:x.v};}
    else{cur.h=Math.max(cur.h,x.h);cur.l=Math.min(cur.l,x.l);cur.c=x.c;cur.v+=x.v;cur.d=x.d;}});
  if(cur)m.push(cur);return m;}

// Unified chart drawing for all timeframes
function drawChart(tf){
  currentTF=tf||currentTF;
  if(ch1)ch1.destroy();if(ch2)ch2.destroy();if(ch3)ch3.destroy();
  let cd,lb,maList,maColors,maLabels,showMACD=true,showNews=false,infoEl=document.getElementById('tf-info');
  if(currentTF==='5m'){
    if(!ID.length){if(infoEl)infoEl.textContent='5分钟数据加载中...';return;}
    const dates=[...new Set(ID.map(x=>x.d))].slice(-3);
    cd=ID.filter(x=>dates.includes(x.d));
    lb=cd.map(x=>x.d.slice(5)+' '+x.tl);
    const II=calcID(cd);
    const n=cd.length-1;
    maList=[II.ma20,II.ma60,II.vwap,II.boll.map(b=>b.u),II.boll.map(b=>b.l)];
    maColors=['#fbbf24','#a78bfa','#67e8f9','#f8717140','#34d39940'];
    maLabels=['MA20','MA60','VWAP','BOLL↑','BOLL↓'];

const _s=(d,p)=>d.map((_,i)=>i<p-1?null:d.slice(i-p+1,i+1).reduce((s,x)=>s+x.c,0)/p);
const _e=(d,p)=>{const k=2/(p+1),r=[];d.forEach((x,i)=>r.push(i===0?x.c:x.c*k+r[i-1]*(1-k)));return r;};
function _r(d,p=14){const r=[];let ag=0,al=0;for(let i=0;i<d.length;i++){if(!i){r.push(50);continue;}const ch=d[i].c-d[i-1].c,g=ch>0?ch:0,l=ch<0?-ch:0;if(i<=p){ag+=g/p;al+=l/p;if(i<p){r.push(50);continue;}}else{ag=(ag*(p-1)+g)/p;al=(al*(p-1)+l)/p;}r.push(al===0?100:100-100/(1+ag/al));}return r;}
function _m(d){const e12=_e(d,12),e26=_e(d,26),ml=e12.map((v,i)=>v-e26[i]);const k=2/10,sig=[];ml.forEach((v,i)=>sig.push(i===0?v:v*k+sig[i-1]*(1-k)));return{dif:ml,dea:sig,bar:ml.map((v,i)=>(v-sig[i])*2)};}
function _bi(d,p){const s=_s(d,p);return d.map((_,i)=>s[i]===null?null:(d[i].c-s[i])/s[i]*100);}
function _k(d,p=9){const r=[];let pk=50,pd=50;for(let i=0;i<d.length;i++){if(i<p-1){r.push({k:50,d:50,j:50});continue;}const sl=d.slice(i-p+1,i+1),lo=Math.min(...sl.map(x=>x.l)),hi=Math.max(...sl.map(x=>x.h));const rsv=hi===lo?50:(d[i].c-lo)/(hi-lo)*100;const k2=2/3*pk+1/3*rsv,dd=2/3*pd+1/3*k2;pk=k2;pd=dd;r.push({k:k2,d:dd,j:3*k2-2*dd});}return r;}
function _bl(d,p,m){const s=_s(d,p);return d.map((_,i)=>{if(i<p-1)return{u:null,m:null,l:null};const sl=d.slice(i-p+1,i+1).map(x=>x.c),mn=s[i],std=Math.sqrt(sl.reduce((a,v)=>a+(v-mn)**2,0)/p);return{u:mn+m*std,m:mn,l:mn-m*std};});}

    {n:'锤子+BOLL下轨',c:'组合',e:'trigger',tp:i=>b10[i].l,b:i=>i>0&&b10[i].l!==null&&d[i].l<=b10[i].l&&lowerShadow(i)>body(i)*1.5&&isGreen(i),s:()=>false},

      tp:i=>i>0?d[i-1].o:d[i].c, // 突破前日开盘=吞没确认
      b:i=>{if(i<2)return false;return!isGreen(i-1)&&isGreen(i)&&d[i].o<=d[i-1].c&&d[i].c>=d[i-1].o&&d[i].v>avgVol(i,10)*2;},s:()=>false},

      tp:i=>d[i].l+(d[i].c-d[i].l)*0.4,
      b:i=>i>0&&kd[i].k>kd[i].d&&kd[i-1].k<=kd[i-1].d&&kd[i].k<P.kdj_low&&lowerShadow(i)>body(i)*1.5,s:()=>false},
    {n:'三连跌后阳线反转',c:'组合',e:'trigger',
      tp:i=>i>0?d[i-1].c:d[i].c, // 看到突破前日收盘价入场
      b:i=>i>3&&pctChg(i-3)<0&&pctChg(i-2)<0&&pctChg(i-1)<0&&isGreen(i)&&body(i)>body(i-1)*1.2,s:()=>false},
    {n:'RSI超卖+长下影线',c:'组合',e:'trigger',
      tp:i=>d[i].l+range(i)*0.3,
      b:i=>i>0&&r14[i]<35&&lowerShadow(i)>range(i)*0.5&&isGreen(i),s:()=>false},
  ];
  const MODE=P.entry_mode; // 'next_open' | 'same_close' | 'trigger'
  const MODES={next_open:'T+1开盘',same_close:'当日尾盘',trigger:'盘中触发'};

  return S.map(s=>{
    const tr=[];
    for(let i=0;i<d.length;i++){
      if(s.b(i))tr.push({t:'B',i,sigP:d[i].c,d:d[i].d,trigP:s.tp?s.tp(i):null});
      if(s.s(i))tr.push({t:'S',i,sigP:d[i].c,d:d[i].d});
    }
    const hr={};[1,3,5].forEach(n2=>{
      const bs=tr.filter(t=>t.t==='B');
      let w=0,lo=0,tot=0,totMx=0,totMd=0;const details=[];
      bs.forEach(b=>{
        // Determine entry price and index based on mode
        let entryP,entryIdx,entryLabel;
        if(MODE==='next_open'){
          entryIdx=b.i+1;
          if(entryIdx>=d.length)return;
          entryP=d[entryIdx].o;
          entryLabel='T+1开';
        }else if(MODE==='trigger'&&s.e==='trigger'&&b.trigP){
          // Trigger-price strategies: enter at trigger price on signal day
          entryIdx=b.i;
          entryP=b.trigP;
          entryLabel='触发';
        }else{
          // same_close or fallback: enter at signal day close
          entryIdx=b.i;
          entryP=d[b.i].c;
          entryLabel='尾盘';
        }
        const exitIdx=Math.min(entryIdx+n2,d.length-1);
        if(exitIdx<=entryIdx&&n2>0)return;
        const exitP=d[exitIdx].c;
        // Scan holding period for max high / min low
        let maxH=entryP,minL=entryP;
        for(let k=entryIdx;k<=exitIdx;k++){
          if(d[k].h>maxH)maxH=d[k].h;
          if(d[k].l<minL)minL=d[k].l;
        }
        const ret=(exitP-entryP)/entryP;
        const mxUp=(maxH-entryP)/entryP;
        const mxDn=(minL-entryP)/entryP;
        tot+=ret;totMx+=mxUp;totMd+=mxDn;
        ret>0?w++:lo++;
        details.push({
          sigDate:b.d, entryDate:d[entryIdx].d, entryLabel,
          entryP, exitP, ret, win:ret>0,
          maxH, minL, mxUp, mxDn,
          entryIdx, exitIdx
        });
      });
      const ct=w+lo;
      hr[n2]={ct, wr:ct?w/ct:0, ar:ct?tot/ct:0, amx:ct?totMx/ct:0, amd:ct?totMd/ct:0, details};
    });
    const li=d.length-1;
    return{...s,tr,hr,bT:s.b(li),sT:s.s(li),bc:tr.filter(t=>t.t==='B').length,entryType:s.e};
  });
}

      <div class="ibox"><div class="l">量比</div><div class="v" style="font-size:17px;color:${cr.vr>2?'var(--rd)':'var(--dm)'}">${cr.vr.toFixed(1)}x</div></div>

      <div class="ibox"><div class="l">均线</div><div style="font-size:12px;font-weight:700;color:${cr.ma5>cr.ma10&&cr.ma10>cr.ma20?'var(--gn)':'var(--or)'}">${cr.ma5>cr.ma10&&cr.ma10>cr.ma20?'多头':'过渡'}</div></div>
      <div class="ibox"><div class="l">MACD</div><div style="font-size:12px;font-weight:700;color:${cr.dif>cr.dea?'var(--gn)':'var(--rd)'}">${cr.dif>cr.dea?'多头':'空头'}</div></div>
    </div></div>
    <div class="card" style="border-color:var(--ac)"><div class="card-t">🎯 买点雷达</div>
      <div style="font-size:12px;line-height:1.8">
        <div style="font-weight:700;color:${cr.r>65||cr.bi5>10?'var(--rd)':'var(--gn)'}">${cr.r>65||cr.bi5>10?'❌ 不宜追高':'🟡 关注中'}</div>
        <div style="margin-top:6px;color:var(--dm);font-size:11px">等待买入价位：</div>
        <div>BIAS${PARAMS.bias_ma}=${PARAMS.bias_buy}% → <b class="mono" style="color:var(--gn)">${bt}</b></div>
        <div>MA10 → <b class="mono" style="color:var(--gn)">${cr.ma10?.toFixed(0)||'—'}</b></div>
        <div>BOLL(${PARAMS.boll_p})下轨 → <b class="mono" style="color:var(--gn)">${cr.b10l?.toFixed(0)||'—'}</b></div>
      </div>
    </div>
  </div></div>

  <!-- BOTTOM -->
  <div class="row"><div class="c6"><div class="card"><div class="card-t">📰 新闻催化</div>
    ${evts.slice(-10).reverse().map(e=>{const bar=data.find(d=>d.d===e.d);const col=e.p==='b'?'var(--gn)':e.p==='r'?'var(--rd)':e.p==='w'?'var(--or)':'var(--dm)';
      return`<div class="ev"><div style="width:8px;height:8px;border-radius:50%;background:${col};flex-shrink:0"></div><div class="mono" style="font-size:11px;color:var(--dm);min-width:46px">${e.d.slice(5)}</div><div style="font-size:12px;flex:1">${e.t}</div>${bar?`<div class="mono" style="font-size:12px;font-weight:700;min-width:44px;text-align:right">${bar.c.toFixed(0)}</div>`:''}</div>`;}).join('')}
  </div>

  <!-- ====== LOCK-UP CARD (TWO BATCHES) ====== -->
  <div class="card lockup-card">
    <div class="card-t">🔒 解禁时间表 <span style="font-size:11px;color:var(--dm);font-weight:400">· 发行价$${LOCKUP.ipoPrice} · 基石浮盈<b style="color:var(--gn)">+${lockPnl}%</b></span></div>
    ${lockupHTML}
    <div style="font-size:10px;color:var(--or);padding:6px 8px;background:#f8717108;border-radius:6px">⚠️ 7月第一批: SII(联想之星+美团~10%) + 基石H股同时解禁，抛压较集中。2027年1月第二批更大: 创始人+全部Pre-IPO VC(红杉/高瓴/启明等)~30%+解锁</div>
  </div>
  </div>

  <div class="c6">
  <!-- ====== STRATEGY RANKING WITH EXPANDABLE DETAILS ====== -->
  <div class="card"><div class="card-t">🏆 策略排行 <span style="font-size:10px;color:var(--dm);font-weight:400">${PARAMS.entry_mode==='next_open'?'T+1开盘买入':PARAMS.entry_mode==='trigger'?'盘中触发/尾盘买入':'当日尾盘买入'} · 持有N日收盘卖出 · 点击展开</span></div><div style="overflow-x:auto"><table>
    <thead><tr><th>#</th><th>策略</th><th>类别</th><th>次</th><th>1日</th><th>3日</th><th>5日</th><th>报酬</th><th>盘中↓</th><th>今</th></tr></thead>
    <tbody>${sr.map((r,i)=>{const h1=r.hr[1]||{wr:0},h3=r.hr[3]||{wr:0,ar:0,amx:0,amd:0},h5=r.hr[5]||{wr:0,ar:0};
      const detailId='sd'+i;
      // Build trade list for detail
      const buys=r.tr.filter(t=>t.t==='B');
      const MODE=PARAMS.entry_mode;
      const tradeRows=buys.slice(-15).reverse().map(b=>{
        // Same entry logic as backtest
        let entryP,entryIdx,entryLabel;
        if(MODE==='next_open'){
          entryIdx=b.i+1;if(entryIdx>=data.length)return'';
          entryP=data[entryIdx].o;entryLabel='T+1开';
        }else if(MODE==='trigger'&&r.e==='trigger'&&b.trigP){
          entryIdx=b.i;entryP=b.trigP;entryLabel='触发';
        }else{
          entryIdx=b.i;entryP=data[b.i].c;entryLabel='尾盘';
        }
        function periodStats(n2){
          const exitIdx=Math.min(entryIdx+n2,data.length-1);
          if(exitIdx<entryIdx||(n2>0&&exitIdx<=entryIdx))return{ret:'—',mxUp:'—',mxDn:'—'};
          let maxH=entryP,minL=entryP;
          for(let k=entryIdx;k<=exitIdx;k++){if(data[k].h>maxH)maxH=data[k].h;if(data[k].l<minL)minL=data[k].l;}
          const ret=((data[exitIdx].c-entryP)/entryP*100).toFixed(1);
          const mxUp=((maxH-entryP)/entryP*100).toFixed(1);
          const mxDn=((minL-entryP)/entryP*100).toFixed(1);
          return{ret,mxUp,mxDn};
        }
        const s1=periodStats(1),s3=periodStats(3),s5=periodStats(5);
        return`<div class="trade-item" style="display:grid;grid-template-columns:46px 36px 44px repeat(3,1fr);gap:4px;align-items:start;padding:4px 0;border-bottom:1px solid #1e294015">
          <span class="mono" style="color:var(--dm)">${b.d.slice(5)}</span>
          <span class="mono" style="font-size:10px;color:var(--dm)">${b.sigP.toFixed(0)}</span>
          <span style="font-size:10px"><span class="mono" style="color:var(--ac)">${entryP.toFixed(0)}</span><br><span style="color:var(--dm)">${entryLabel}</span></span>
          <span style="font-size:10px"><span class="mono" style="color:${parseFloat(s1.ret)>=0?'var(--gn)':'var(--rd)'}">${s1.ret}%</span><br><span style="color:var(--dm)">↑${s1.mxUp}% ↓${s1.mxDn}%</span></span>
          <span style="font-size:10px"><span class="mono" style="color:${parseFloat(s3.ret)>=0?'var(--gn)':'var(--rd)'}">${s3.ret}%</span><br><span style="color:var(--dm)">↑${s3.mxUp}% ↓${s3.mxDn}%</span></span>
          <span style="font-size:10px"><span class="mono" style="color:${parseFloat(s5.ret)>=0?'var(--gn)':'var(--rd)'}">${s5.ret}%</span><br><span style="color:var(--dm)">↑${s5.mxUp}% ↓${s5.mxDn}%</span></span>
        </div>`;
      }).join('');

      return`<tr class="str-row" onclick="toggleDetail('${detailId}',this)"><td style="color:var(--dm);font-weight:700">${i+1}</td><td style="font-weight:600">${r.n}${PARAMS.entry_mode==='trigger'&&r.entryType==='trigger'?' <span style="font-size:8px;padding:1px 4px;background:var(--ac);color:#fff;border-radius:3px">限价</span>':''}</td><td style="color:var(--dm)">${r.c}</td><td class="mono">${r.bc}</td>
      <td class="mono" style="color:${cc(h1.wr)};font-weight:700">${(h1.wr*100).toFixed(0)}%</td>
      <td class="mono" style="color:${cc(h3.wr)};font-weight:700">${(h3.wr*100).toFixed(0)}%</td>
      <td class="mono" style="color:${cc(h5.wr)};font-weight:700">${(h5.wr*100).toFixed(0)}%</td>
      <td class="mono" style="color:${h3.ar>=0?'var(--gn)':'var(--rd)'}">${h3.ar>=0?'+':''}${(h3.ar*100).toFixed(1)}%</td>
      <td class="mono" style="color:var(--rd)">${((h3.amd||0)*100).toFixed(1)}%</td>
      <td>${r.bT?'<b style="color:var(--gn)">买</b>':r.sT?'<b style="color:var(--rd)">卖</b>':'—'}</td></tr>
      <tr class="str-detail" id="${detailId}"><td colspan="10">
        <div class="dt-grid">
          <div class="dt-box"><div class="dt-l">1日 胜率/报酬</div><b class="mono" style="color:${cc(h1.wr)}">${(h1.wr*100).toFixed(0)}%</b> / <span class="mono">${((h1.ar||0)*100).toFixed(1)}%</span>
            <div style="font-size:9px;color:var(--dm);margin-top:2px">盘中↑<span style="color:var(--gn)">${((h1.amx||0)*100).toFixed(1)}%</span> ↓<span style="color:var(--rd)">${((h1.amd||0)*100).toFixed(1)}%</span></div></div>
          <div class="dt-box"><div class="dt-l">3日 胜率/报酬</div><b class="mono" style="color:${cc(h3.wr)}">${(h3.wr*100).toFixed(0)}%</b> / <span class="mono">${(h3.ar*100).toFixed(1)}%</span>
            <div style="font-size:9px;color:var(--dm);margin-top:2px">盘中↑<span style="color:var(--gn)">${((h3.amx||0)*100).toFixed(1)}%</span> ↓<span style="color:var(--rd)">${((h3.amd||0)*100).toFixed(1)}%</span></div></div>
          <div class="dt-box"><div class="dt-l">5日 胜率/报酬</div><b class="mono" style="color:${cc(h5.wr)}">${(h5.wr*100).toFixed(0)}%</b> / <span class="mono">${(h5.ar*100).toFixed(1)}%</span>
            <div style="font-size:9px;color:var(--dm);margin-top:2px">盘中↑<span style="color:var(--gn)">${((h5.amx||0)*100).toFixed(1)}%</span> ↓<span style="color:var(--rd)">${((h5.amd||0)*100).toFixed(1)}%</span></div></div>
          <div class="dt-box"><div class="dt-l">买/卖次数</div><span class="mono">${r.tr.filter(t=>t.t==='B').length} / ${r.tr.filter(t=>t.t==='S').length}</span>
            <div style="font-size:9px;color:var(--dm);margin-top:2px">风险报酬比(3日): <b class="mono" style="color:var(--yl)">${h3.amd?((h3.amx||0)/Math.abs(h3.amd)).toFixed(1):'—'}</b></div></div>
        </div>
        <div style="margin-top:8px;font-size:10px;color:var(--dm)">最近15笔买入明细 <span style="color:var(--ac)">信号日 · 收盘价 · 买入价(方式) · 持有1日(↑↓) · 3日(↑↓) · 5日(↑↓)</span></div>
        <div class="trade-list">${tradeRows||'<div style="color:var(--dm);padding:4px">无买入记录</div>'}</div>
      </td></tr>`;}).join('')}</tbody></table></div></div></div></div>

  <div style="font-size:9px;color:var(--dm);text-align:center;padding:16px 0;border-top:1px solid var(--bd)">
    <div style="max-width:720px;margin:0 auto;text-align:left;line-height:1.6">
      <b style="color:var(--or)">⚠️ 风险警告</b><br>
      · 本工具仅为个人学习使用的技术分析辅助面板，<b style="color:var(--rd)">不构成任何投资建议</b><br>
      · 数据来源: ${live?lastFetchSrc||'在线':'离线近似'} · 日线级别OHLCV · 每5分钟自动刷新<br>
      · 回测基于 IPO 以来约 ${data.length} 个交易日，样本极小，统计意义有限<br>
      · 回测逻辑: 信号确认 → 按「${PARAMS.entry_mode==='next_open'?'T+1开盘价':PARAMS.entry_mode==='trigger'?'盘中触发价/尾盘价':'当日尾盘价'}」买入 → 持有N日后收盘卖出<br>
      · 入场方式可切换: 当日尾盘(盯盘下单) / T+1开盘(保守) / 盘中触发(配合5分钟图)<br>
      · 5分钟线数据来源Yahoo/腾讯，仅供盘中实时参考，VWAP每日重置<br>
      · 盘中最大浮盈/回撤 = 持有期间每日最高/最低价 vs 实际买入价，反映持有期间真实波动风险<br>
      · K线形态识别(锤子/吞没/十字星等)基于日线 OHLC 四价，不含分时数据<br>
      · 智谱为2026年1月上市次新股，流通盘极小(H股仅~8.5%)，波动剧烈，技术指标参考价值受限<br>
      · 解禁数据来源于招股书，实际减持行为取决于市场条件及股东意愿
    </div>
    ${!live?`<div style="margin-top:6px;text-align:left;background:var(--c2);padding:8px;border-radius:6px;color:var(--rd)">
      <b>⚠️ 数据获取失败，显示离线数据（可能不准确）。</b> 尝试记录：<br>
      ${fetchLog.map(l=>`<span style="color:${l.status.startsWith('✅')?'var(--gn)':'var(--rd)'}">· [${l.src}] ${l.url}... → ${l.status}</span><br>`).join('')}
      <div style="margin-top:4px;color:var(--yl)">💡 可尝试：1) 刷新重试 2) 换浏览器/网络 3) 点「＋ 输入」手动填今日收盘价</div>
    </div>`:''}</div>`;

  setTimeout(()=>{drawChart(currentTF);},80);
  // Fetch intraday data in background
  (async()=>{const id=await fdIntraday();if(id){ID=id;if(currentTF==='5m')drawChart('5m');}})();
  startAutoRefresh();
}

function toggleDetail(id,row){
  const det=document.getElementById(id);
  if(!det)return;
  det.classList.toggle('open');
  row.classList.toggle('open');
}

function setP(key,val){
  PARAMS[key]=val;
  go(D,!!document.querySelector('.badge')?.textContent?.includes('实时'));
}

function dc(data,I){ drawChart(currentTF); }
function switchTF(tf){ currentTF=tf; drawChart(tf); }

function ap(){const c=parseFloat(document.getElementById('ic').value);if(!c)return alert('输入收盘价');const L=D[D.length-1];
  D.push({d:new Date().toISOString().slice(0,10),o:L.c,h:Math.max(parseFloat(document.getElementById('ih').value)||c,c,L.c),l:Math.min(parseFloat(document.getElementById('il').value)||c,c,L.c),c,v:parseFloat(document.getElementById('iv').value)||L.v});go(D,false);}
async function rl(silent){
  if(!silent)document.getElementById('app').innerHTML='<div class="loading"><div class="sp"></div><div style="margin-top:12px">获取数据...</div></div>';
  const d=await fd();if(d){localStorage.setItem('zd',JSON.stringify(d));go(d,true);}else go(D.length?D:FB,false);
}

(async()=>{const d=await fd();if(d?.length>5){localStorage.setItem('zd',JSON.stringify(d));go(d,true);}
  else{try{const c=JSON.parse(localStorage.getItem('zd'));if(c?.length>5){go(c,false);return;}}catch(e){}go(FB,false);}})();
</script>
</body>
</html>
